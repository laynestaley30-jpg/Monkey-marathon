addEventListener('keydown',e=>{if(started&&!e.repeat&&(e.code==='KeyT'||e.code==='KeyC'))flTog()});
let found=0,t0=performance.now(),last=t0,done=false;
function tryMove(dx,dz){const r=.5;const ok=(x,z)=>!(solidG(x+r,z)||solidG(x-r,z)||solidG(x,z+r)||solidG(x,z-r)||solidG(x+r,z+r)||solidG(x-r,z-r)||solidG(x+r,z-r)||solidG(x-r,z+r));
 if(ok(P.x+dx,P.z))P.x+=dx;if(ok(P.x,P.z+dz))P.z+=dz}
// ===== multiplayer (live room: presence carries position + collected-orb mask + round) =====
const MP={room:null,mask:0,round:0,rem:new Map(),nm:'Ape '+(10+Math.random()*90|0),h:+Math.random().toFixed(3),sent:0,lx:NaN,lz:NaN,lm:-1,lr:-1,n:1,client:false,monIn:null,monOut:null,crashes:true};
{const $=id=>document.getElementById(id),bP=$('bPlay'),bM=$('bMulti'),bP2=$('bPub'),bH=$('bHost'),bJ=$('bJoin'),note=$('note'),mp=$('mp'),codeIn=$('code');
bP.onclick=()=>begin();

// peer-to-peer room: the host relays everyone's state (x,z,orb mask,round,name,hue) to everyone else
const clean=o=>({x:+o.x||0,z:+o.z||0,f:(o.f|0)&63,r:Math.max(0,Math.min(1e6,o.r|0)),nm:String(o.nm||'Ape').slice(0,12),h:+o.h||0,v:o.v?1:0});
const NET={isHost:false,conn:null,conns:new Map(),states:new Map(),me:{},id:'',code:''};
const netRoom={
 peers(){const a=[{peer:NET.id||'me',sameTab:true,presence:NET.me}];NET.states.forEach((v,k)=>{if(k!==NET.id)a.push({peer:k,sameTab:false,presence:v})});return a},

const fail=m=>{note.textContent=m;bP2.disabled=bH.disabled=bJ.disabled=false};
const go=()=>{MP.room=netRoom;MP.tag=NET.code;micBtn.style.display='block';try{actx()}catch(e){}if(!started)begin()};
const mkCode=()=>{const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=a[Math.random()*a.length|0];return c};

// ===== voice chat: audio calls straight between players (mesh); presence field v=1 means mic on =====
const VOICE={stream:null,calls:new Map(),aud:new Map(),ctx:null};
const actx=()=>{if(!VOICE.ctx)VOICE.ctx=new(window.AudioContext||window.webkitAudioContext)();if(VOICE.ctx.state==='suspended')VOICE.ctx.resume().catch(()=>{});return VOICE.ctx};
['pointerdown','keydown','touchend'].forEach(t=>addEventListener(t,()=>{if(VOICE.ctx&&VOICE.ctx.state==='suspended')VOICE.ctx.resume().catch(()=>{})},{passive:true}));
const vStop=id=>{const e=VOICE.aud.get(id);if(e){try{if(e.src)e.src.disconnect();if(e.g)e.g.disconnect()}catch(x){}e.a.srcObject=null;e.a.remove();VOICE.aud.delete(id)}};
const vHook=c=>{VOICE.calls.set(c.peer,c);
 c.on('stream',st=>{vStop(c.peer);const a=document.createElement('audio');a.autoplay=true;a.playsInline=true;a.srcObject=st;document.body.appendChild(a);
  const e={a};try{const cx=actx(),src=cx.createMediaStreamSource(st),g=cx.createGain();g.gain.value=0;src.connect(g);g.connect(cx.destination);e.g=g;e.src=src;a.muted=true}catch(x){a.volume=0}
  VOICE.aud.set(c.peer,e);try{a.play().catch(()=>{})}catch(x){}});
 const end=()=>{if(VOICE.calls.get(c.peer)===c){vStop(c.peer);VOICE.calls.delete(c.peer)}};c.on('close',end);c.on('error',end)};
const vClear=()=>{VOICE.calls.forEach(c=>{try{c.close()}catch(e){}});VOICE.calls.clear();[...VOICE.aud.keys()].forEach(vStop)};
const vAttach=p=>p.on('call',c=>{const o=VOICE.calls.get(c.peer);if(o){VOICE.calls.delete(c.peer);vStop(c.peer);try{o.close()}catch(e){}}c.answer(VOICE.stream||undefined);vHook(c)});
setInterval(()=>{if(!NET.id||!NET.peer)return;const ids=new Set(NET.states.keys());ids.delete(NET.id);
 VOICE.calls.forEach((c,k)=>{if(!ids.has(k)){try{c.close()}catch(e){}VOICE.calls.delete(k);vStop(k)}});
 if(!VOICE.stream)return;
 ids.forEach(k=>{if(VOICE.calls.has(k))return;const q=NET.states.get(k);if(q&&q.v&&!(NET.id<k))return;
  try{const c=NET.peer.call(k,VOICE.stream);if(c)vHook(c)}catch(e){}})},1500);
// proximity: full volume within 8 units, fading to silence at 60; walls in between muffle the voice
const los=(x0,z0,x1,z1)=>{const n=Math.ceil(Math.hypot(x1-x0,z1-z0));for(let i=1;i<n;i++){const t=i/n;if(solid(x0+(x1-x0)*t,z0+(z1-z0)*t))return false}return true};
MP.vol=(id,d,x,z)=>{const e=VOICE.aud.get(id);if(!e)return;let t=d<=8?1:d>=60?0:Math.pow(1-(d-8)/52,1.5);if(t>0&&!los(P.x,P.z,x,z))t*=.35;
 const cur=e.g?e.g.gain.value:e.a.volume,nv=cur+(t-cur)*.25;if(e.g)e.g.gain.value=nv;else e.a.volume=Math.max(0,Math.min(1,nv))};
const micBtn=document.createElement('div');micBtn.style.cssText='position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:12px;font-size:26px;padding:6px 10px;background:rgba(0,0,0,.45);border-radius:10px;z-index:5;user-select:none;cursor:pointer;display:none';
const setMic=()=>{micBtn.textContent=VOICE.stream?'\u{1F3A4}':'\u{1F507}';micBtn.style.background=VOICE.stream?'rgba(200,30,20,.75)':'rgba(0,0,0,.45)';micBtn.title=VOICE.stream?'Mic on (M)':'Mic off (M)'};
async function toggleMic(){
 if(VOICE.stream){VOICE.stream.getTracks().forEach(t=>t.stop());VOICE.stream=null;vClear();netRoom.presence({v:0});setMic();return}
 try{VOICE.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false})}
 catch(e){alert('Microphone access was blocked. Allow it in your browser to use voice chat.');return}
 vClear();netRoom.presence({v:1});setMic()}
micBtn.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});micBtn.addEventListener('click',toggleMic);document.body.appendChild(micBtn);setMic();
addEventListener('keydown',e=>{if(e.code==='KeyM'&&MP.room&&started&&document.activeElement!==codeIn)toggleMic()});
const PUB=6;
function host(code,pubI){MP.client=false;MP.crashes=!!document.getElementById('crashChk').checked;NET.isHost=true;NET.conn=null;NET.code=pubI?'Public lobby '+pubI:'Room '+code;vClear();const p=new Peer('mmarathon-'+code);NET.peer=p;vAttach(p);
 p.on('open',id=>{NET.id=id;NET.states=new Map([[id,NET.me]]);NET.conns.clear();note.textContent='';go();clearInterval(NET.iv);
  NET.iv=setInterval(()=>{const o={};NET.states.forEach((v,k)=>o[k]=v);NET.conns.forEach(c=>{if(c.open)c.send({t:'all',p:o,m:MP.monOut})})},66)});
 p.on('error',e=>{if(e.type==='unavailable-id'){p.destroy();if(pubI)join('public-'+pubI,pubI);else host(mkCode());return}fail('Could not reach the matchmaking server ('+e.type+').')});
 p.on('connection',c=>{
  if(NET.conns.size>=7){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),300)});return}
  c.on('open',()=>NET.conns.set(c.peer,c));
  c.on('data',d=>{if(d&&d.t==='s'&&d.s&&typeof d.s==='object')NET.states.set(c.peer,clean(d.s))});
  const gone=()=>{NET.conns.delete(c.peer);NET.states.delete(c.peer)};c.on('close',gone);c.on('error',gone)})}
// join(code) = private room; join('public-N',N) = public slot N: join its host, or become the host if nobody is there, or try slot N+1 if full
function join(code,pubI){if(!pubI){code=code.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);if(code.length<4){fail('Enter the 4-character room code.');return}}
 clearInterval(NET.iv);NET.isHost=false;NET.conn=null;NET.conns.clear();if(NET.peer)try{NET.peer.destroy()}catch(e){}
 note.textContent=pubI?'Finding a server\u2026':'Connecting\u2026';vClear();const p=new Peer();NET.peer=p;vAttach(p);let ok=false,full=false,dead=false;
 const miss=()=>{if(dead)return;dead=true;clearTimeout(to);try{p.destroy()}catch(e){}if(pubI)host(code,pubI);else fail('No game found with that code.')};
 const to=setTimeout(()=>{if(!ok)miss()},10000);
 p.on('error',e=>{if(dead)return;if(e.type==='peer-unavailable')miss();else{dead=true;clearTimeout(to);fail('Connection problem ('+e.type+').')}});
 p.on('open',id=>{NET.id=id;const c=p.connect('mmarathon-'+code,{reliable:true});NET.conn=c;
  c.on('open',()=>{ok=true;MP.client=true;clearTimeout(to);NET.code=pubI?'Public lobby '+pubI:'Room '+code;note.textContent='';c.send({t:'s',s:NET.me});go()});
  c.on('data',d=>{if(!d)return;
   if(d.t==='full'){full=true;dead=true;MP.client=false;try{p.destroy()}catch(e){}if(pubI&&pubI<PUB)join('public-'+(pubI+1),pubI+1);else fail('All public servers are full.');return}
   if(d.t==='all'&&d.p&&typeof d.p==='object'){const m=new Map();for(const k in d.p)if(k!==NET.id&&m.size<8)m.set(k,clean(d.p[k]||{}));NET.states=m;const q=d.m;if(q&&typeof q==='object'&&Number.isFinite(+q.x)&&Number.isFinite(+q.z))MP.monIn={x:+q.x,z:+q.z,yw:+q.yw||0,c:q.c?1:0,sp:Math.max(0,Math.min(60,+q.sp||0)),st:q.st?1:0}}});
  c.on('close',()=>{if(!ok||full)return;MP.client=false;MP.monIn=null;NET.states=new Map();NET.conn=null;
   if(pubI){MP.tag='Public lobby (reconnecting\u2026)';setTimeout(()=>join('public-1',1),400+Math.random()*1500)}else MP.tag='Room '+code+' (host left)'})})}
bP2.onclick=()=>{bP2.disabled=bH.disabled=bJ.disabled=true;join('public-1',1)};
bH.onclick=()=>{bP2.disabled=bH.disabled=bJ.disabled=true;note.textContent='Creating room\u2026';host(mkCode())};
bJ.onclick=()=>{bP2.disabled=bH.disabled=bJ.disabled=true;join(codeIn.value)};
codeIn.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')bJ.click()});codeIn.addEventListener('keyup',e=>e.stopPropagation())}
const tagTex=s=>{const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='bold 34px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,8,256,48);x.fillStyle='#fff';x.fillText(s,128,33);return new THREE.CanvasTexture(c)};
function addRemote(q,x,z){const M=PM.build(),tm=PM.mat.clone();tm.color.setHSL(Number.isFinite(+q.h)?+q.h%1:0,.5,.72);
 M.root.traverse(m=>{if(m.isMesh&&m.material===PM.mat)m.material=tm});
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tagTex(String(q.nm||'Ape').replace(/[^\w \-]/g,'').slice(0,12)),transparent:true,depthWrite:false}));sp.scale.set(2.6,.65,1);scene.add(sp);
 return{M,tm,sp,A:PM.mkAnim(M,x,z,0),x,z,tx:x,tz:z}}
function dropRemote(R){scene.remove(R.M.root,R.sp);R.M.root.traverse(m=>{if(m.geometry)m.geometry.dispose()});R.tm.dispose();R.sp.material.map.dispose();R.sp.material.dispose()}
function mpSync(now,dt){const r=MP.room;let n=1;
 if(r){const ps=r.peers();n=ps.length||1;let R=MP.round;
  for(const p of ps)if(Number.isInteger(p.presence.r)&&p.presence.r>R&&p.presence.r<1e6)R=p.presence.r;
  if(R>MP.round){MP.round=R;MP.mask=0;msg.onclick=null;if(done){done=false;t0=now;msg.style.display='none';MON.reset()}}
  let u=MP.mask;const seen=new Set();
  for(const p of ps){const q=p.presence;if(q.r===MP.round&&Number.isInteger(q.f))u|=q.f&63;
   if(p.sameTab)continue;const x=+q.x,z=+q.z;if(!Number.isFinite(x)||!Number.isFinite(z))continue;
   seen.add(p.peer);let e=MP.rem.get(p.peer);if(!e){e=addRemote(q,x,z);MP.rem.set(p.peer,e)}
   if(Math.hypot(x-e.x,z-e.z)>30){e.x=x;e.z=z}e.tx=x;e.tz=z}
  MP.mask=u;
  for(const[k,e]of MP.rem)if(!seen.has(k)){dropRemote(e);MP.rem.delete(k)}
  if(now-MP.sent>80&&(P.x!==MP.lx||P.z!==MP.lz||MP.mask!==MP.lm||MP.round!==MP.lr)){MP.sent=now;MP.lx=P.x;MP.lz=P.z;MP.lm=MP.mask;MP.lr=MP.round;
   r.presence({x:+P.x.toFixed(2),z:+P.z.toFixed(2),f:MP.mask,r:MP.round,nm:MP.nm,h:MP.h}).catch(()=>{})}}
 const k=1-Math.exp(-14*dt);
 for(const[id,e]of MP.rem){e.x+=(e.tx-e.x)*k;e.z+=(e.tz-e.z)*k;e.A.step(e.x,e.z,dt,now);e.sp.position.set(e.x,3.9,e.z);if(MP.vol)MP.vol(id,Math.hypot(e.x-P.x,e.z-P.z),e.x,e.z)}
 MP.n=n;MP.names=r?r.peers().map(q=>(q.sameTab?'You':String(q.presence.nm||'Ape').slice(0,12))+(q.presence.v?' \u{1F3A4}':'')):[]}
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
 if(started&&!done){let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-mv.y,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+mv.x;
  if(keys.ArrowLeft)P.yaw+=1.8*dt;if(keys.ArrowRight)P.yaw-=1.8*dt;
  const sp=(keys.ShiftLeft?43:22)*dt,sn=Math.sin(P.yaw),cn=Math.cos(P.yaw);
  tryMove((-sn*f+cn*s)*sp,(-cn*f-sn*s)*sp);
  orbs.forEach((o,i)=>{if(!(MP.mask>>i&1)&&Math.hypot(o.position.x-P.x,o.position.z-P.z)<.9)MP.mask|=1<<i})}
 mpSync(now,dt);
 found=0;orbs.forEach((o,i)=>{const c=MP.mask>>i&1;o.visible=!c;found+=c});
 if(started&&!done&&found===6){done=true;msg.style.display='flex';msg.innerHTML='<div><b style="font-size:26px">You escaped!</b><br>Time: '+((now-t0)/1000).toFixed(1)+'s<br><br>Tap to play again</div>';
  msg.onclick=()=>{MP.round++;MP.mask=0;done=false;t0=performance.now();msg.onclick=null;MON.reset()}}
 orbs.forEach((o,i)=>o.position.y=2.2+Math.sin(now/500+i)*.12);
 if(started&&!done)MON.update(dt,now);else MON.calm();PM.update(dt,now);torch.position.copy(cam.position);{const held=flOn&&PM.tp&&PM.root.visible;if(held)PM.lens.getWorldPosition(FL.position);else if(flOn)PM.vmLens.getWorldPosition(FL.position);else FL.position.copy(cam.position);const cp=Math.cos(P.pitch);FL.target.position.set(FL.position.x-Math.sin(P.yaw)*cp,FL.position.y+Math.sin(P.pitch),FL.position.z-Math.cos(P.yaw)*cp)}FL.intensity=flOn?5:0;
 hud.textContent=`Orbs ${found}/6   ${((done?last:now)-t0)/1000|0}s`+(MP.tag?`   ${MP.tag}`:'')+(inSafe(P.x,P.z)?'   \u{1F6E1} SAFE ZONE':'')+(MP.room?`\nPlayers online (${MP.n}): ${MP.names.join(', ')}`:'');
 ren.render(scene,cam)}
requestAnimationFrame(loop);
